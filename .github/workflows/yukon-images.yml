name: Yukon images

# Builds the two images Yukon runs this benchmark with (yukon/Dockerfile) after the harness tests
# pass, and pushes them to GHCR. benchmark.json pins them by the digests this prints.
on:
  push:
    branches: [yukon]
    paths: [yukon/**, utils/**, tokenizer/**, train/speedrun/run.py, pyproject.toml, uv.lock]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        # GHCR names are lower case; the owner follows the repository wherever it moves.
        run: echo "IMAGES=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yukon-noise" >> "$GITHUB_ENV"
      - name: Make room for the CUDA stack
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Harness tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: yukon/Dockerfile
          target: harness-test
      - name: Participant image
        id: participant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: yukon/Dockerfile
          target: participant
          push: true
          tags: ${{ env.IMAGES }}-participant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verifier image
        id: verifier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: yukon/Dockerfile
          target: verifier
          push: true
          tags: ${{ env.IMAGES }}-verifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digests for benchmark.json
        run: |
          {
            echo "participant: ${IMAGES}-participant@${{ steps.participant.outputs.digest }}"
            echo "verifier: ${IMAGES}-verifier@${{ steps.verifier.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
